<section class="py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="section-title">Productos</h2>
    <a class="btn btn-primary" routerLink="/ventas/nueva"><i class="ri-shopping-cart-line me-1"></i>Nueva venta</a>
  </div>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
        <tr>
          <th>#</th>
          <th>Producto</th>
          <th class="text-end">Precio</th>
          <th class="text-end">Stock</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="loading"><td colspan="4" class="text-center text-secondary">Cargando...</td></tr>
        <tr *ngIf="!loading && !products.length"><td colspan="4" class="text-center text-secondary">No hay productos</td></tr>
        <tr *ngFor="let p of products">
          <td>{{ p.id }}</td>
          <td>{{ p.name }}</td>
          <td class="text-end">{{ p.price | number:'1.2-2' }}</td>
          <td class="text-end">{{ p.stock | number }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
